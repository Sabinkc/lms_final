<!-- Mobile Screen Content Container -->
<div class="relative z-10 flex flex-col justify-between px-margin py-gutter-sm max-w-md mx-auto w-full">
<!-- Top Status Bar Area -->
<div class="flex items-center justify-between py-space-xs text-on-surface">
<span class="font-label-lg text-label-lg tracking-tight">9:41</span>
<div class="flex items-center space-x-1.5">
<!-- Cellular Signal -->
<span class="material-symbols-outlined text-[17px] leading-none" style="font-variation-settings: 'FILL' 1;">signal_cellular_4_bar</span>
<!-- Wi-Fi -->
<span class="material-symbols-outlined text-[17px] leading-none" style="font-variation-settings: 'FILL' 1;">wifi</span>
<!-- Battery Status -->
<div class="flex items-center space-x-1 pl-1">
<span class="font-label-sm text-label-sm">98%</span>
<span class="material-symbols-outlined text-[20px] leading-none -rotate-90">battery_full</span>
</div>
</div>
</div>
<!-- Branding & Identity -->
<div class="flex flex-col items-center text-center mt-space-md">
<!-- Centered Circular Cloud-shaped Logo Wrapper -->
<div class="relative w-24 h-24 rounded-full bg-surface-container-lowest shadow-md flex items-center justify-center p-2 mb-space-sm transform transition-transform active:scale-95 duration-200">
<div class="w-full h-full rounded-full bg-surface-container-low flex items-center justify-center overflow-hidden">
<img alt="CloudsLMS Logo" class="w-20 h-20 object-contain drop-shadow-sm" src="https://lh3.googleusercontent.com/aida/AEtjO1UY5xhGFQeJY9cYdXh7xaUM-ranC2DUtvfKp6HupbVVeWnNhYkkxDyjaqitKWDrEdKNuyYoDU14CK4SbsMMxj-bMiPcQb9WTSuTgjsfqr1zhmOHJzUmUMyMSOUI1csW_yoPWSfxYtOVAPZYlb1GTmxzTwABUjyW-r4bWdT6D0i-Dc5H_X4pOlnNvkISTlgW-0nUBmrWaUX7xYOejjdIE2gG4a1l-xMMUHNOGLUxki6zo4knDO6akPn9fb8"/>
</div>
<div class="absolute bottom-0 right-1 w-6 h-6 rounded-full bg-secondary flex items-center justify-center text-on-secondary shadow-sm">
<span class="material-symbols-outlined text-[14px]">school</span>
</div>
</div>
<!-- Two-Tone Wordmark -->
<div class="flex items-center tracking-tight font-headline-lg-mobile text-headline-lg-mobile">
<span class="text-primary font-bold">Clouds</span>
<span class="text-secondary font-extrabold tracking-normal">LMS</span>
</div>
<!-- Tagline with Warm Bullets -->
<div class="flex items-center space-x-2 mt-1 text-outline font-title-sm text-title-sm tracking-wide">
<span>Learn</span>
<span class="w-1.5 h-1.5 rounded-full bg-tertiary-fixed-dim inline-block"></span>
<span>Manage</span>
<span class="w-1.5 h-1.5 rounded-full bg-tertiary-fixed-dim inline-block"></span>
<span>Grow</span>
</div>
</div>
<!-- Card / Form Area -->
<div class="w-full mt-space-lg bg-surface-container-lowest/90 backdrop-blur-sm rounded-xl p-space-lg shadow-md">
<!-- Welcome Heading & Playful Accent -->
<div class="mb-space-md">
<h1 class="font-headline-md text-headline-md tracking-tight">
<span class="text-on-surface">Welcome</span>
<span class="text-primary ml-1">Back</span>
</h1>
<div class="flex flex-col items-start mt-0.5">
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to continue your account.</p>
<div class="w-10 h-1 rounded-full bg-tertiary-fixed-dim mt-1.5"></div>
</div>
</div>
<!-- Form Inputs -->
<form class="space-y-space-md" id="loginForm" onsubmit="event.preventDefault();">
<!-- Username / Student ID -->
<div class="relative flex items-center bg-surface-container-low rounded-full px-2 py-1.5 shadow-sm transition-all focus-within:bg-surface-container-lowest focus-within:shadow-md">
<div class="w-9 h-9 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<input autocomplete="username" class="w-full bg-transparent px-space-sm font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="usernameInput" placeholder="Student ID or Username" required="" type="text"/>
</div>
<!-- Password -->
<div class="space-y-1">
<div class="relative flex items-center bg-surface-container-low rounded-full px-2 py-1.5 shadow-sm transition-all focus-within:bg-surface-container-lowest focus-within:shadow-md">
<div class="w-9 h-9 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<input autocomplete="current-password" class="w-full bg-transparent px-space-sm font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="passwordInput" placeholder="Password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="w-8 h-8 flex items-center justify-center text-outline hover:text-on-surface focus:outline-none pr-1 rounded-full transition-colors" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-0.5">
<button class="font-title-sm text-title-sm text-primary hover:text-primary-container active:underline focus:outline-none transition-colors" type="button">
              Forgot password?
            </button>
</div>
</div>
<!-- Primary Log In Action -->
<div class="pt-space-xs">
<button class="w-full h-12 rounded-full bg-primary-container text-on-primary flex items-center justify-center space-x-2 shadow-md hover:bg-primary active:scale-[0.98] transition-all duration-150" id="submitBtn" type="submit">
<span class="font-label-lg text-label-lg">Log In</span>
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</div>
</button>
</div>
</form>
<!-- Horizontal Divider -->
<div class="relative flex items-center justify-center my-space-md">
<div class="w-full h-[1px] bg-surface-container-highest"></div>
<span class="absolute px-space-sm bg-surface-container-lowest font-label-sm text-label-sm text-outline uppercase tracking-wider">OR</span>
</div>
<!-- Quick QR Login -->
<button class="w-full h-12 rounded-full bg-surface-container-low text-primary flex items-center justify-center space-x-2 hover:bg-surface-container active:scale-[0.98] transition-all duration-150" type="button">
<span class="material-symbols-outlined text-[22px]">qr_code_scanner</span>
<span class="font-label-lg text-label-lg">Scan Student QR Code</span>
</button>
</div>
<!-- Micro Interaction Feedback / Student Quick Assist -->
<div class="mt-space-md mb-space-sm flex flex-col items-center text-center space-y-space-xs">
<div class="flex items-center space-x-1.5 text-on-surface-variant font-body-sm text-body-sm">
<span class="material-symbols-outlined text-[16px] text-tertiary-fixed-dim">help_outline</span>
<span>Need help?</span>
<button class="font-title-sm text-title-sm text-primary underline underline-offset-2 hover:text-primary-container focus:outline-none" type="button">
          Contact School Admin
        </button>
</div>
<p class="font-label-sm text-label-sm text-outline">CloudsLMS Secure Student &amp; Faculty Portal v4.2</p>
</div>
<!-- Mobile Home Indicator -->
<div class="flex justify-center pb-space-xs pt-space-xs">
<div class="w-32 h-1 rounded-full bg-outline-variant/60"></div>
</div>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (loginForm && submitBtn) {
      loginForm.addEventListener('submit', () => {
        const originalContent = submitBtn.innerHTML;
        submitBtn.innerHTML = `
          <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
          <span class="font-label-lg text-label-lg ml-2">Authenticating...</span>
        `;
        submitBtn.disabled = true;
        setTimeout(() => {
          submitBtn.innerHTML = originalContent;
          submitBtn.disabled = false;
        }, 1400);
      });
    }
  })();
</script></main></body></html>
